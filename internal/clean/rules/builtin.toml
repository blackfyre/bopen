# Built-in rules for bopen.
#
# kind   tracking | affiliate | redirect
# param  query parameter name (tracking/affiliate); a trailing * matches a prefix
# hosts  optional host globs (path.Match syntax); empty matches any host
# path   redirect only: exact URL path of the wrapper; empty matches any path
# target redirect only: parameters holding the target URL, first present wins
# reason shown to the user next to every suggestion

# --- Tracking parameters on any host -------------------------------------

[[rule]]
kind   = "tracking"
param  = "utm_*"
reason = "Campaign attribution (Urchin Tracking Module): tells Google Analytics and similar tools which newsletter, ad or post sent you. The page works the same without it."

[[rule]]
kind   = "tracking"
param  = "fbclid"
reason = "Facebook click identifier: lets Facebook and the site link this visit to your Facebook activity."

[[rule]]
kind   = "tracking"
param  = "gclid"
reason = "Google Ads click identifier: ties this visit to a specific ad click for conversion tracking."

[[rule]]
kind   = "tracking"
param  = "dclid"
reason = "Google Campaign Manager / Display & Video 360 click identifier for display-ad tracking."

[[rule]]
kind   = "tracking"
param  = "gbraid"
reason = "Google Ads click identifier used for app-to-web conversion measurement."

[[rule]]
kind   = "tracking"
param  = "wbraid"
reason = "Google Ads click identifier used for web-to-app conversion measurement."

[[rule]]
kind   = "tracking"
param  = "msclkid"
reason = "Microsoft Advertising (Bing Ads) click identifier for conversion tracking."

[[rule]]
kind   = "tracking"
param  = "yclid"
reason = "Yandex Direct ad click identifier for conversion tracking."

[[rule]]
kind   = "tracking"
param  = "mc_eid"
reason = "Mailchimp subscriber identifier: tells the sender which recipient clicked the link."

[[rule]]
kind   = "tracking"
param  = "mc_cid"
reason = "Mailchimp campaign identifier: records which email campaign the click came from."

[[rule]]
kind   = "tracking"
param  = "igshid"
reason = "Instagram share identifier: links this visit back to the account that shared the link."

[[rule]]
kind   = "tracking"
param  = "_hsenc"
reason = "HubSpot email tracking token identifying the recipient who clicked."

[[rule]]
kind   = "tracking"
param  = "_hsmi"
reason = "HubSpot email message identifier used for click tracking."

[[rule]]
kind   = "tracking"
param  = "mkt_tok"
reason = "Marketo email token identifying the recipient who clicked."

# --- Redirect wrappers ----------------------------------------------------

[[rule]]
kind   = "redirect"
hosts  = ["www.google.*", "google.*"]
path   = "/url"
target = ["q", "url"]
reason = "Google click-tracking redirect: Google records the click before forwarding you to the real page."

[[rule]]
kind   = "redirect"
hosts  = ["l.facebook.com", "lm.facebook.com"]
path   = "/l.php"
target = ["u"]
reason = "Facebook outbound-link redirect: Facebook records the click before forwarding you."

[[rule]]
kind   = "redirect"
hosts  = ["*.safelinks.protection.outlook.com"]
target = ["url"]
reason = "Microsoft Safe Links wrapper: Microsoft records the click and scans the target before forwarding you. Unwrapping skips that scan."

[[rule]]
kind   = "redirect"
hosts  = ["www.youtube.com", "youtube.com"]
path   = "/redirect"
target = ["q"]
reason = "YouTube outbound-link redirect: YouTube records the click before forwarding you."

# --- Affiliate parameters (kept unless you untick them) -------------------

[[rule]]
kind   = "affiliate"
param  = "tag"
hosts  = ["amazon.*", "*.amazon.*"]
reason = "Amazon Associates affiliate tag: credits whoever shared the link with a commission. Removing it does not change the price."
