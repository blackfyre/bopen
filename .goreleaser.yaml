# GoReleaser configuration: `goreleaser release --snapshot --clean` builds
# every release asset locally into dist/; pushing a v* tag publishes them.
version: 2

project_name: bopen

builds:
  # Gio links against the system Wayland/X11/EGL libraries, so the Linux
  # build needs cgo and the development packages on the build host.
  - id: linux
    main: ./cmd/bopen
    binary: bopen
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    # arm64 is cross-compiled on the amd64 runner with Ubuntu's multiarch
    # packages; see scripts/setup-arm64-cross.sh.
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
  # The Windows build needs no C toolchain. -H=windowsgui avoids a console
  # window on every clicked link.
  - id: windows
    main: ./cmd/bopen
    binary: bopen
    goos: [windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -H=windowsgui -X main.version={{ .Version }}"]

archives:
  # Version-less names keep releases/latest/download/<asset> URLs stable.
  - id: default
    ids: [linux, windows]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

nfpms:
  - id: packages
    ids: [linux]
    package_name: bopen
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/blackfyre/bopen
    maintainer: bopen maintainers <https://github.com/blackfyre/bopen>
    description: >-
      Link inspector registered as the default browser: highlights tracking
      parameters and redirect wrappers with reasons, then opens the link in the
      browser you choose.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/bopen/LICENSE
      - src: README.md
        dst: /usr/share/doc/bopen/README.md
    overrides:
      deb:
        dependencies:
          - libegl1
          - libwayland-client0
          - libwayland-cursor0
          - libwayland-egl1
          - libx11-6
          - libx11-xcb1
          - libxkbcommon0
          - libxkbcommon-x11-0
          - libxcursor1
          - libxfixes3
      rpm:
        dependencies:
          - libglvnd-egl
          - libwayland-client
          - libwayland-cursor
          - libwayland-egl
          - libX11
          - libX11-xcb
          - libxkbcommon
          - libxkbcommon-x11
          - libXcursor
          - libXfixes

# winget manifests are generated on every release. They are submitted as a
# pull request to microsoft/winget-pkgs (from the blackfyre/winget-pkgs fork)
# only when the WINGET_GITHUB_TOKEN secret is set.
winget:
  - name: bopen
    package_identifier: blackfyre.bopen
    publisher: blackfyre
    publisher_url: https://github.com/blackfyre
    short_description: Link inspector that removes tracking and opens links in the browser you choose
    description: >-
      bopen registers as the default web browser. When a link is clicked it
      shows the link with redirect wrappers and tracking parameters
      highlighted, each with the reason it is suggested for removal, and
      opens the result in the browser, profile or private window you choose.
    license: MIT
    license_url: https://github.com/blackfyre/bopen/blob/main/LICENSE
    homepage: https://github.com/blackfyre/bopen
    release_notes_url: https://github.com/blackfyre/bopen/releases/tag/{{ .Tag }}
    tags: [browser, privacy, tracking, url, link]
    skip_upload: '{{ if envOrDefault "WINGET_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: blackfyre
      name: winget-pkgs
      branch: "bopen-{{ .Version }}"
      token: '{{ envOrDefault "WINGET_GITHUB_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  github:
    owner: blackfyre
    name: bopen
  prerelease: auto
